spring:

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_platform
    username: ecommerce
    password: ecommerce


  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true


  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/ecommerce


  web:
    resources:
      static-locations:
        - classpath:/static/
        - file:uploads/



application:

  tenant:
    default-domain: local
    default-name: Local Tenant



keycloak:

  server-url: http://localhost:8081

  realm: ecommerce

  admin:
    username: admin
    password: admin

  client-id: admin-cli