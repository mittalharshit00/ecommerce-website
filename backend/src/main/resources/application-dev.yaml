spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_platform
    username: ecommerce
    password: ecommerce
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true